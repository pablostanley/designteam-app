name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build every workspace package first — shim re-exports in
      # src/lib/agent-builder/ import via dist/, and adapter packages
      # peer-depend on core. Tests can't resolve imports until dist exists.
      - name: Build workspace packages
        run: pnpm -r --filter './packages/*' run build

      - name: Run tests
        run: pnpm test

      - name: Type-check packages
        run: pnpm -r --filter './packages/*' run lint

      - name: Run behavioral evals
        run: pnpm eval

      # Web app (Next.js) build is intentionally handled by Vercel's preview
      # deployment check, which runs on every PR with real Supabase env vars.
      # Duplicating it here would need the env vars as secrets and waste CI
      # minutes. Core is still built above for the tests to resolve imports.
