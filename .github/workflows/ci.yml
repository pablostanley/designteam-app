name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build core first — the shim re-exports in src/lib/agent-builder/
      # import @designteam/core via its dist/ entry, so tests fail to resolve
      # it until dist exists.
      - name: Build @designteam/core
        run: pnpm --filter @designteam/core run build

      - name: Run tests
        run: pnpm test

      - name: Type-check core package
        run: pnpm --filter @designteam/core run lint

      - name: Build web app
        run: pnpm build
